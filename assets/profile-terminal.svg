<text x="110" y="134" fill="#c9d1d9">↳ Akane — self-hoster · agent wrangler</text>
<text x="110" y="153" fill="#7a7f99">  nothing here is a product · nothing here is for sale</text>
<text x="110" y="182" fill="#a78bfa">akane@fleet</text>
<text x="220" y="182" fill="#7a7f99">:</text>
<text x="226" y="182" fill="#7ee787">~</text>
<text x="236" y="182" fill="#7a7f99">$</text>
