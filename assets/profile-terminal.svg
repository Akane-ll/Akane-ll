<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Akane — terminal profile">
  <defs>
    <linearGradient id="ti-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1238"/>
      <stop offset="1" stop-color="#0d0820"/>
    </linearGradient>
    <filter id="ti-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="556" fill="url(#ti-stage)"/>

  <g filter="url(#ti-shadow)">
    <rect x="80" y="40" width="1040" height="476" rx="14" fill="#11131c"/>
    <rect x="80" y="40" width="1040" height="38" rx="14" fill="#1c1f2e"/>
    <rect x="80" y="60" width="1040" height="18" fill="#1c1f2e"/>
    <line x1="80" y1="78" x2="1120" y2="78" stroke="#0a0c14" stroke-width="0.6"/>
  </g>

  <circle cx="106" cy="59" r="6.5" fill="#ff5f56"/>
  <circle cx="128" cy="59" r="6.5" fill="#ffbd2e"/>
  <circle cx="150" cy="59" r="6.5" fill="#27c93f"/>
  <text x="600" y="63" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7a7f99" letter-spacing="2">~/akane — zsh — 124×46</text>

  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14">
<text x="110" y="112" fill="#a78bfa">akane@fleet</text>
<text x="220" y="112" fill="#7a7f99">:</text>
<text x="226" y="112" fill="#7ee787">~</text>
