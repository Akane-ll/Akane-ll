<text x="110" y="204" fill="#c9d1d9">● fleet.service — active (running): photos · feeds · containers · dashboards</text>
<text x="110" y="223" fill="#58a6ff">Immich · Miniflux · Beszel · Arcane · Open WebUI</text>
<text x="110" y="242" fill="#58a6ff">heartbeat — monitor.akaneri.tech</text>
<text x="110" y="271" fill="#a78bfa">akane@fleet</text>
<text x="220" y="271" fill="#7a7f99">:</text>
<text x="226" y="271" fill="#7ee787">~</text>
<text x="236" y="271" fill="#7a7f99">$</text>
<text x="248" y="271" fill="#c9d1d9">cat into.txt</text>
<text x="110" y="293" fill="#c9d1d9">- zero-trust networking — every door locked, one key per human</text>
<text x="110" y="312" fill="#c9d1d9">- the unglamorous craft: backups, uptime, dashboards that tell the truth</text>
<text x="110" y="331" fill="#c9d1d9">- AI models — watching the frontier on homelab hardware</text>
<text x="110" y="360" fill="#a78bfa">akane@fleet</text>
<text x="220" y="360" fill="#7a7f99">:</text>
<text x="226" y="360" fill="#7ee787">~</text>
<text x="236" y="360" fill="#7a7f99">$</text>
<text x="248" y="360" fill="#c9d1d9">tail -4 off_the_clock</text>
<text x="110" y="382" fill="#c9d1d9">listening  日向文 · 羊文学 · 星野源 — on Spotify</text>
<text x="110" y="401" fill="#c9d1d9">reading    Japanese mystery novels · WeRead annual member</text>
<text x="110" y="420" fill="#c9d1d9">playing    Overwatch · Death Stranding</text>
<text x="110" y="439" fill="#c9d1d9">watching   anime, seasonally</text>
<text x="110" y="468" fill="#a78bfa">akane@fleet</text>
<text x="220" y="468" fill="#7a7f99">:</text>
<text x="226" y="468" fill="#7ee787">~</text>
<text x="236" y="468" fill="#7a7f99">$</text>
<rect x="252" y="456" width="9" height="14" fill="#c9d1d9">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
  </g>

  <rect x="80" y="494" width="1040" height="22" rx="14" fill="#171a26"/>
