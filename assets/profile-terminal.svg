  <g transform="translate(80,509)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5a5f7a">
    <text x="30" y="0">UTF-8</text>
    <text x="96" y="0">zsh</text>
    <text x="156" y="0">ctrl-l · clear</text>
    <text x="1010" y="0" text-anchor="end" fill="#7ee787">● connected</text>
